<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- macOS icon grid: 824px body centered on a 1024px canvas, room left for the drop shadow -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4FA3FF"/>
      <stop offset="1" stop-color="#2F55E8"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".38"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB340"/><stop offset="1" stop-color="#FF8A00"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5BE07A"/><stop offset="1" stop-color="#24B848"/></linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF6482"/><stop offset="1" stop-color="#F0244C"/></linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE45C"/><stop offset="1" stop-color="#FFC800"/></linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0A1F7A" flood-opacity=".3"/>
    </filter>
  </defs>

  <g filter="url(#drop)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shine)"/>
  </g>

  <!-- the folder -->
  <g filter="url(#soft)">
    <rect x="252" y="262" width="520" height="520" rx="128" fill="url(#glass)" stroke="#fff" stroke-opacity=".45" stroke-width="4"/>
    <rect x="304" y="314" width="190" height="190" rx="50" fill="url(#orange)"/>
    <rect x="530" y="314" width="190" height="190" rx="50" fill="url(#green)"/>
    <rect x="304" y="540" width="190" height="190" rx="50" fill="url(#pink)"/>
    <rect x="530" y="540" width="190" height="190" rx="50" fill="url(#yellow)"/>
  </g>

  <!-- sparkle: sorted automatically -->
  <path filter="url(#soft)" fill="#fff" d="M770 168c10 58 34 82 92 92-58 10-82 34-92 92-10-58-34-82-92-92 58-10 82-34 92-92z"/>
  <path fill="#fff" opacity=".85" d="M858 352c5 26 15 36 41 41-26 5-36 15-41 41-5-26-15-36-41-41 26-5 36-15 41-41z"/>
</svg>
