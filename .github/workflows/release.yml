# Push a version tag (e.g. v0.1.0) to build the universal DMG and publish it to GitHub Releases.
# Pushes to main and pull requests only build, so a broken build shows up before you tag.
name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create the release and upload the DMG

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match package.json version $v"; exit 1; }

      - name: Build and publish release
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build only
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: release/*.dmg
          retention-days: 7
